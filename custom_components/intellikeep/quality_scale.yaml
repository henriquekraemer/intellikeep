rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: >
      Integration type is "service" with iot_class "local_push". No polling is
      performed; all state changes are pushed locally.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >
      IntelliKeep is a local software helper with no external device or service
      connections. There is nothing to test before configuring.
  test-before-setup:
    status: exempt
    comment: >
      No external connection exists. The coordinator initialises from local
      storage, which always succeeds.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: >
      The integration is local_push with no network dependency. Connectivity
      loss is not a concept that applies here.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >
      IntelliKeep requires no credentials or authentication of any kind.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >
      The integration is a local software service and does not support
      any discovery mechanism.
  discovery:
    status: exempt
    comment: >
      IntelliKeep is a purely local software service — there is no hardware
      device to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: >
      IntelliKeep is a software-only integration with no physical hardware
      devices. There are no compatible/incompatible devices to list.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >
      The integration creates exactly one virtual device tied to the config
      entry. No additional devices are ever added dynamically.
  entity-category: done
  entity-device-class:
    status: exempt
    comment: >
      The three sensors (tasks due today, tasks overdue, next due task) have no
      applicable HA SensorDeviceClass.
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >
      IntelliKeep has no external dependencies, credentials, or versioned
      external services. No user-intervention repair scenario can occur.
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: >
      The integration has no external library dependencies (requirements: []).
      All code uses HA's native asyncio APIs exclusively.
  inject-websession:
    status: exempt
    comment: >
      The integration makes no HTTP requests to external services.
  strict-typing: done
