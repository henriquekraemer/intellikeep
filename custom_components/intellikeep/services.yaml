# Names and descriptions of the actions and their fields live in
# translations/*.json (and strings.json), under "services".

load_sample_data:

create_task:
  fields:
    name:
      required: true
      selector:
        text:
    description:
      selector:
        text:
    priority:
      default: medium
      selector:
        select:
          translation_key: priority
          options:
            - low
            - medium
            - high
            - critical
    frequency:
      default: one_time
      selector:
        select:
          translation_key: frequency
          options:
            - one_time
            - daily
            - weekly
            - monthly
            - yearly
    repeat_interval:
      default: 1
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box
    schedule_anchor:
      default: completion
      selector:
        select:
          translation_key: schedule_anchor
          options:
            - completion
            - due_date
    icon:
      selector:
        icon:
    weekdays:
      selector:
        select:
          multiple: true
          translation_key: weekdays
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    due_date:
      selector:
        datetime:
    linked_entity_ids:
      selector:
        entity:
          multiple: true
    notify_days_before:
      default: 1
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: days
    notify_on_overdue:
      default: true
      selector:
        boolean:

complete_task:
  fields:
    task_id:
      required: true
      selector:
        text:
    completed_by:
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true

reopen_task:
  fields:
    task_id:
      required: true
      selector:
        text:
    performed_by:
      selector:
        text:

delete_task:
  fields:
    task_id:
      required: true
      selector:
        text:

update_task:
  fields:
    task_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    description:
      selector:
        text:
    priority:
      selector:
        select:
          translation_key: priority
          options: [low, medium, high, critical]
    frequency:
      selector:
        select:
          translation_key: frequency
          options: [one_time, daily, weekly, monthly, yearly]
    repeat_interval:
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box
    schedule_anchor:
      selector:
        select:
          translation_key: schedule_anchor
          options: [completion, due_date]
    icon:
      selector:
        icon:
    weekdays:
      selector:
        select:
          multiple: true
          translation_key: weekdays
          options: [mon, tue, wed, thu, fri, sat, sun]
    due_date:
      selector:
        datetime:
    linked_entity_ids:
      selector:
        entity:
          multiple: true
    notify_days_before:
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: days
    notify_on_overdue:
      selector:
        boolean:
    enabled:
      selector:
        boolean:
    updated_by:
      selector:
        text:

add_task_note:
  fields:
    task_id:
      required: true
      selector:
        text:
    content:
      required: true
      selector:
        text:
          multiline: true
    added_by:
      selector:
        text:

delete_task_note:
  fields:
    task_id:
      required: true
      selector:
        text:
    note_id:
      required: true
      selector:
        text:

delete_all_data:
