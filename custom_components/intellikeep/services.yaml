load_sample_data:
  name: Load Sample Data
  description: Populate IntelliKeep with sample home maintenance tasks for testing and demonstration.

create_task:
  name: Create Task
  description: Create a new IntelliKeep maintenance task.
  fields:
    name:
      name: Name
      description: Task name.
      required: true
      selector:
        text:
    description:
      name: Description
      description: Optional task description.
      selector:
        text:
    priority:
      name: Priority
      description: Task priority level.
      default: medium
      selector:
        select:
          options:
            - low
            - medium
            - high
            - critical
    frequency:
      name: Frequency
      description: How often the task repeats.
      default: one_time
      selector:
        select:
          options:
            - one_time
            - daily
            - weekly
            - monthly
            - yearly
            - custom
    custom_days_interval:
      name: Custom Interval (days)
      description: Days between occurrences when frequency is "custom".
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box
          unit_of_measurement: days
    due_date:
      name: Due Date
      description: When the task is due.
      selector:
        datetime:
    linked_entity_ids:
      name: Linked Entities
      description: Home Assistant entity IDs associated with this task.
      selector:
        entity:
          multiple: true
    notify_days_before:
      name: Notify Days Before
      description: How many days before due date to send a reminder.
      default: 1
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: days
    notify_on_overdue:
      name: Notify When Overdue
      description: Send a notification when the task becomes overdue.
      default: true
      selector:
        boolean:

complete_task:
  name: Complete Task
  description: Mark an IntelliKeep task as completed.
  fields:
    task_id:
      name: Task ID
      description: The unique ID of the task to complete.
      required: true
      selector:
        text:
    completed_by:
      name: Completed By
      description: Name or identifier of who completed the task.
      selector:
        text:
    notes:
      name: Notes
      description: Optional completion notes.
      selector:
        text:
          multiline: true

reopen_task:
  name: Reopen Task
  description: Reopen a completed IntelliKeep task, marking it as pending again.
  fields:
    task_id:
      name: Task ID
      description: The unique ID of the task to reopen.
      required: true
      selector:
        text:

delete_task:
  name: Delete Task
  description: Permanently delete an IntelliKeep task.
  fields:
    task_id:
      name: Task ID
      description: The unique ID of the task to delete.
      required: true
      selector:
        text:

update_task:
  name: Update Task
  description: Update fields of an existing IntelliKeep task.
  fields:
    task_id:
      name: Task ID
      description: The unique ID of the task to update.
      required: true
      selector:
        text:
    name:
      name: Name
      selector:
        text:
    description:
      name: Description
      selector:
        text:
    priority:
      name: Priority
      selector:
        select:
          options: [low, medium, high, critical]
    frequency:
      name: Frequency
      selector:
        select:
          options: [one_time, daily, weekly, monthly, yearly, custom]
    due_date:
      name: Due Date
      selector:
        datetime:
    linked_entity_ids:
      name: Linked Entities
      selector:
        entity:
          multiple: true
    notify_days_before:
      name: Notify Days Before
      selector:
        number:
          min: 0
          max: 365
    enabled:
      name: Enabled
      selector:
        boolean:
    updated_by:
      name: Updated By
      description: Name or identifier of who made the update.
      selector:
        text:

add_task_note:
  name: Add Task Note
  description: Add a note to an existing IntelliKeep task.
  fields:
    task_id:
      name: Task ID
      description: The unique ID of the task to add a note to.
      required: true
      selector:
        text:
    content:
      name: Content
      description: The text content of the note.
      required: true
      selector:
        text:
          multiline: true
    added_by:
      name: Added By
      description: Name or identifier of who added the note.
      selector:
        text:

delete_task_note:
  name: Delete Task Note
  description: Delete a specific note from an IntelliKeep task.
  fields:
    task_id:
      name: Task ID
      description: The unique ID of the task that owns the note.
      required: true
      selector:
        text:
    note_id:
      name: Note ID
      description: The unique ID of the note to delete.
      required: true
      selector:
        text:

delete_all_data:
  name: Delete All Data
  description: Permanently delete all IntelliKeep tasks, notes and execution history.
