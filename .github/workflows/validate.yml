name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hacs-validation:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lovelace card
        uses: docker://node:20-alpine
        with:
          entrypoint: sh
          args: -c "cd /github/workspace/lovelace-card && npm ci --prefer-offline && npm run build"

      - name: Build Panel
        uses: docker://node:20-alpine
        with:
          entrypoint: sh
          args: -c "cd /github/workspace/panel && npm ci --prefer-offline && npm run build"

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: custom_components/intellikeep/frontend/*.js

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: custom_components/intellikeep/frontend/

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
